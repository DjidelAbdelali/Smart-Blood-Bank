name: Build Android APK & iOS Mobile App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Next.js Static Export
        env:
          STATIC_EXPORT: "true"
        run: npm run build

      - name: Initialize Capacitor Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Distribution
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/smart-blood-bank.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-blood-bank-apk
          path: build-artifacts/smart-blood-bank.apk
          retention-days: 30

  build-ios:
    name: Build & Validate iOS Project
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Next.js Static Export
        env:
          STATIC_EXPORT: "true"
        run: npm run build

      - name: Initialize Capacitor iOS Platform
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Build iOS Archive (Unsigned)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-blood-bank-ios-project
          path: ios/
          retention-days: 30
